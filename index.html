<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Croix</title>

<style>
html, body {
    height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, #a8c6d8, #eaf4f4);
    color: #2f3e4e;
    text-align: center;
}

/* Conteneur */
.container {
    width: 100%;
    max-width: 600px;
    padding: 20px;
}

/* Carte */
.card {
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}


/* Question */
h1 {
    font-size: 20px;
    margin-bottom: 20px;
}

/* Boutons */
.choice {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    background: #2f3e4e;
    color: white;
    transition: 0.3s;
}

.choice:hover {
    background: #1f2a35;
}

/* Messages */
.success, .error {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
}

.success {
    background: #dff5e1;
    border-left: 5px solid #2e7d32;
}

.error {
    background: #fde2e2;
    border-left: 5px solid #c62828;
}
</style>
</head>

<body>

<div class="container">
    <div class="card">

		
		<p class="story">
Muettes en apparence, les pierres anciennes ont tant à raconter.

</p>
        <h1>A t-on avis, pourquoi leur accorde-t-on tant de valeur ?</h1>

        <button class="choice" data-correct="true">Elles gardent la mémoire du territoire</button>
        <button class="choice" data-correct="false">Elles brillent dans le noir</button>
        <button class="choice" data-correct="false">Elles peuvent servir à faire du feu</button>

        <div id="success" class="success">
            ✅ Bonne réponse !<br><br>
        Ces pierres sont les témoins du passé : elles racontent l’histoire, les croyances et la vie d’autrefois…
        </div>

        <div id="error" class="error">
            ❌ Mauvaise réponse… Essaie encore !
        </div>

    </div>
</div>

<script>
const buttons = document.querySelectorAll(".choice");
const success = document.getElementById("success");
const error = document.getElementById("error");

buttons.forEach(button => {
    button.addEventListener("click", () => {
        const isCorrect = button.getAttribute("data-correct") === "true";

        if (isCorrect) {
            success.style.display = "block";
            error.style.display = "none";
        } else {
            error.style.display = "block";
            success.style.display = "none";
        }
    });
});
</script>

</body>
</html>
